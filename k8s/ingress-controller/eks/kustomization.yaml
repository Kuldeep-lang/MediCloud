# Ingress controller on EKS: identical to the local install, but exposed through an AWS
# Network Load Balancer instead of a NodePort.
#   kubectl apply -k k8s/ingress-controller/eks
#
# IMPORTANT (cost): this Service creates an NLB that Terraform does NOT manage. Delete it
# BEFORE `terraform destroy` - scripts/aws-teardown.sh does this automatically - otherwise
# the NLB keeps billing and blocks deletion of the VPC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: Service
      name: nginx-ingress
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
