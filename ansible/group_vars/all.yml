---
# Shared by every play.
project_name: medicloud
aws_region: ap-southeast-2
repo_root: /work # the repository is mounted here inside the control-node container

# Images in ECR. The tag defaults to the most recently pushed backend image; override with
#   -e image_tag=<tag>
ecr_repositories:
  - medicloud-backend
  - medicloud-frontend

demo_admin_email: admin@medicloud.demo
