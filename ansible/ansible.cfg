# Used through ANSIBLE_CONFIG (set in the control-node image), because Ansible ignores an
# ansible.cfg in a world-writable directory, which is how Windows bind mounts appear.
[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
remote_user = ubuntu
private_key_file = /home/ansible/.secrets/id_ed25519
vault_password_file = /home/ansible/.secrets/vault_pass
interpreter_python = auto_silent
forks = 5
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.builtin.timer
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, yaml, ini

[ssh_connection]
pipelining = True
# Hosts are recreated every session, so a new host key is expected: accept new keys, but
# still refuse a changed key for an address already in known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/ansible/.secrets/known_hosts
