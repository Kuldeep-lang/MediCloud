---
- name: Write the Compose file (images pinned to the ECR tag)
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ medicloud_dir }}/compose.yaml"
    owner: root
    group: "{{ medicloud_user }}"
    mode: "0640"

- name: Write the secrets file (from ansible-vault, readable by root only)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ medicloud_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  diff: false # never print secrets, even with --diff
