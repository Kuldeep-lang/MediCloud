---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter (verified against the release's sha256sums.txt)
  ansible.builtin.get_url:
    url: "{{ monitoring_agent_release_url }}/{{ monitoring_agent_archive }}.tar.gz"
    dest: "/usr/local/src/{{ monitoring_agent_archive }}.tar.gz"
    checksum: "sha256:{{ monitoring_agent_release_url }}/sha256sums.txt"
    owner: root
    group: root
    mode: "0644"

- name: Unpack node_exporter
  ansible.builtin.unarchive:
    src: "/usr/local/src/{{ monitoring_agent_archive }}.tar.gz"
    dest: /usr/local/src
    remote_src: true
    creates: "/usr/local/src/{{ monitoring_agent_archive }}/node_exporter"

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "/usr/local/src/{{ monitoring_agent_archive }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Install the systemd unit (sandboxed)
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Start node_exporter now and on boot
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
