---
# End-to-end checks against a running MediCloud: the web app, the API behind it, and a
# real login. Retries cover start-up, NLB target registration and DNS propagation.
- name: Web app answers ({{ healthcheck_base_url }})
  ansible.builtin.uri:
    url: "{{ healthcheck_base_url }}/healthz"
    headers: "{{ healthcheck_headers }}"
    status_code: 200
  register: healthcheck_web
  until: healthcheck_web.status == 200
  retries: "{{ healthcheck_retries }}"
  delay: "{{ healthcheck_delay }}"

- name: API answers through the same origin
  ansible.builtin.uri:
    url: "{{ healthcheck_base_url }}/api/v1/system/info"
    headers: "{{ healthcheck_headers }}"
    return_content: true
  register: healthcheck_api
  until: healthcheck_api.status == 200
  retries: "{{ healthcheck_retries }}"
  delay: "{{ healthcheck_delay }}"

- name: The demo administrator can log in
  ansible.builtin.uri:
    url: "{{ healthcheck_base_url }}/api/v1/auth/login"
    headers: "{{ healthcheck_headers }}"
    method: POST
    body_format: json
    body:
      email: "{{ demo_admin_email }}"
      password: "{{ healthcheck_password }}"
    status_code: 200
  register: healthcheck_login
  no_log: true # the request carries a password

- name: Login returned a token
  ansible.builtin.assert:
    that: "'access_token' in healthcheck_login.json"
    success_msg: "MediCloud {{ healthcheck_api.json.version | default('') }} is healthy at {{ healthcheck_base_url }}"
