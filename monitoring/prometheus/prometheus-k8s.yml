# Prometheus configuration for the EKS cluster (mounted from a ConfigMap generated by
# monitoring/k8s/kustomization.yaml). Targets are discovered, not hard-coded.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: medicloud-eks

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI pods opt in with prometheus.io/* annotations (k8s/04-backend-deployment.yaml).
  # /metrics is never routed through the Ingress; it is scraped pod-to-pod, which the
  # backend NetworkPolicy allows only from this namespace.
  - job_name: medicloud-backend
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [medicloud]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: backend
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # F5 NGINX Ingress Controller (started with -enable-prometheus-metrics).
  - job_name: nginx-ingress
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [nginx-ingress]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Object state: deployments, pods, restarts, HPA replicas.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.medicloud-monitoring.svc:8080"]

  # Container CPU/memory from each kubelet's cAdvisor, through the API server's node proxy
  # (works on EKS without opening kubelet ports). Only the series the dashboard uses are kept.
  - job_name: kubernetes-cadvisor
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total
        action: keep
      - source_labels: [namespace]
        regex: medicloud|medicloud-monitoring|nginx-ingress
        action: keep

  # The Ansible-managed EC2 VM (node_exporter). Ansible writes its private IP into the
  # prometheus-file-sd ConfigMap; the security group admits 9100 from the EKS cluster SG.
  - job_name: app-host-node
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/*.json"]
        refresh_interval: 1m
